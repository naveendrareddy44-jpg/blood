<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Blood Request - LifeFlow</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="brand" style="text-decoration: none;">
            <div class="logo-icon"><i class="fa-solid fa-droplet"></i></div>
            <span class="brand-name">LifeFlow Network</span>
        </a>
        <div class="nav-right">
            <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a>
            <a href="admin.html" class="btn-admin"><i class="fa-solid fa-user-shield"></i> Admin Portal</a>
        </div>
    </header>

    <main class="form-container">
        <div class="form-header">
            <h2><i class="fa-solid fa-bed-pulse icon-red"></i> Patient Emergency Blood Request</h2>
            <p>Directly alerts nearby registered blood banks and compatible donors.</p>
        </div>

        <form action="#" class="structured-form">
            <div class="form-section">
                <h3>Patient & Requirement Details</h3>
                <div class="form-grid">
                    <div class="input-field">
                        <label>Patient Full Name</label>
                        <input type="text" placeholder="Enter patient name" required>
                    </div>
                    <div class="input-field">
                        <label>Blood Group Required</label>
                        <select class="highlight-select" required>
                            <option value="">Select Required Group</option>
                            <option>A+</option><option>A-</option>
                            <option>B+</option><option>B-</option>
                            <option>O+</option><option>O-</option>
                            <option>AB+</option><option>AB-</option>
                        </select>
                    </div>
                    <div class="input-field">
                        <label>Units Required (Bags/Pints)</label>
                        <input type="number" min="1" max="10" placeholder="e.g. 2" required>
                    </div>
                    <div class="input-field">
                        <label>Urgency Level</label>
                        <select class="urgent-select" required>
                            <option value="normal">Routine (Within 48 hours)</option>
                            <option value="urgent">Urgent (Within 12 hours)</option>
                            <option value="critical">Critical Emergency (Immediate)</option>
                        </select>
                    </div>
                    <div class="input-field full-width">
                        <label>Hospital Name & Ward Number</label>
                        <input type="text" placeholder="e.g. St. Jude Hospital, Room 402" required>
                    </div>
                    <div class="input-field">
                        <label>Attendant / Contact Person</label>
                        <input type="text" placeholder="Contact Person Name" required>
                    </div>
                    <div class="input-field">
                        <label>Contact Phone Number</label>
                        <input type="tel" placeholder="+1 (555) 000-0000" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit btn-urgent"><i class="fa-solid fa-truck-medical"></i> Dispatch Blood Request</button>
        </form>
    </main>

</body>
</html>
