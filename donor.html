<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Registration - LifeFlow</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="brand" style="text-decoration: none;">
            <div class="logo-icon"><i class="fa-solid fa-droplet"></i></div>
            <span class="brand-name">LifeFlow Network</span>
        </a>
        <div class="nav-right">
            <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a>
            <a href="admin.html" class="btn-admin"><i class="fa-solid fa-user-shield"></i> Admin Portal</a>
        </div>
    </header>

    <main class="form-container">
        <div class="form-header">
            <h2><i class="fa-solid fa-hand-holding-medical icon-red"></i> Donor Registration Portal</h2>
            <p>Please enter accurate details to assist blood banks in matching patient needs quickly.</p>
        </div>

        <form action="#" class="structured-form">
            <!-- Step 1 -->
            <div class="form-section">
                <span class="section-tag">Step 1</span>
                <h3>Personal & Identification Info</h3>
                <div class="form-grid">
                    <div class="input-field">
                        <label>Full Name</label>
                        <input type="text" placeholder="John Doe" required>
                    </div>
                    <div class="input-field">
                        <label>Age (18-65)</label>
                        <input type="number" min="18" max="65" placeholder="e.g. 28" required>
                    </div>
                    <div class="input-field">
                        <label>Gender</label>
                        <select required>
                            <option value="">Select Gender</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div class="input-field">
                        <label>Blood Group</label>
                        <select class="highlight-select" required>
                            <option value="">Select Group</option>
                            <option>A+</option><option>A-</option>
                            <option>B+</option><option>B-</option>
                            <option>O+</option><option>O-</option>
                            <option>AB+</option><option>AB-</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Step 2 -->
            <div class="form-section">
                <span class="section-tag">Step 2</span>
                <h3>Health Status & Eligibility</h3>
                <div class="form-grid">
                    <div class="input-field">
                        <label>Body Weight (kg)</label>
                        <input type="number" placeholder="e.g. 65" min="45" required>
                    </div>
                    <div class="input-field">
                        <label>Last Donation Date (If applicable)</label>
                        <input type="date">
                    </div>
                    <div class="input-field full-width">
                        <label>Do you have any ongoing medical conditions?</label>
                        <input type="text" placeholder="e.g. None, Asthma, Diabetes (Optional)">
                    </div>
                </div>
            </div>

            <!-- Step 3 -->
            <div class="form-section">
                <span class="section-tag">Step 3</span>
                <h3>Contact & Location Details</h3>
                <div class="form-grid">
                    <div class="input-field">
                        <label>Phone Number</label>
                        <input type="tel" placeholder="+1 (555) 000-0000" required>
                    </div>
                    <div class="input-field">
                        <label>Email Address</label>
                        <input type="email" placeholder="john@example.com" required>
                    </div>
                    <div class="input-field full-width">
                        <label>Full Address / City</label>
                        <input type="text" placeholder="Street address, City, State" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit"><i class="fa-solid fa-paper-plane"></i> Complete Donor Registration</button>
        </form>
    </main>

</body>
</html>
