<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Donor Registration</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1>🩸 Blood Bank Portal</h1>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="donor.html">Donor Registration</a>
            <a href="patient.html">Patient Portal</a>
        </nav>
    </header>

    <div class="container">
        <div class="card">
            <h2>🩺 Donor Credentials & Health Form</h2>
            <form id="donorForm">
                <label>Full Name</label>
                <input type="text" name="name" required placeholder="John Doe">

                <label>Phone Number</label>
                <input type="text" name="phone" required placeholder="+1234567890">

                <label>Blood Group</label>
                <select name="bloodGroup" required>
                    <option value="A+">A+</option><option value="A-">A-</option>
                    <option value="B+">B+</option><option value="B-">B-</option>
                    <option value="O+">O+</option><option value="O-">O-</option>
                    <option value="AB+">AB+</option><option value="AB-">AB-</option>
                </select>

                <label>Age (years)</label>
                <input type="number" name="age" required placeholder="25">

                <label>Weight (kg)</label>
                <input type="number" name="weight" required placeholder="65">

                <label>Any Chronic Diseases / Medical History?</label>
                <input type="text" name="diseaseHistory" placeholder="Type 'None' or describe condition">

                <label>Location</label>
                <input type="text" name="location" required placeholder="City or Area">

                <button type="submit">Submit & Check Health Eligibility</button>
            </form>

            <div id="donorResult"></div>
        </div>
    </div>

    <script>
        document.getElementById('donorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const payload = Object.fromEntries(formData.entries());

            const res = await fetch('/api/donors/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            const resultDiv = document.getElementById('donorResult');

            if (data.donor.isHealthy) {
                resultDiv.innerHTML = `
                    <div class="result-box success">
                        <h3>✅ Registration Approved!</h3>
                        <p><strong>Quality Status:</strong> ${data.donor.qualityScore}</p>
                        <p><strong>Donor ID:</strong> ${data.donor.id}</p>
                        <p>Your blood is marked as healthy and ready for collection.</p>
                    </div>`;
            } else {
                resultDiv.innerHTML = `
                    <div class="result-box error">
                        <h3>❌ Disqualified from Donation</h3>
                        <p><strong>Reason:</strong> ${data.donor.rejectionReason}</p>
                    </div>`;
            }
        });
    </script>
</body>
</html>
